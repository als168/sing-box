name: Build Sing-Box (Simple)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Pull latest code
        run: git pull origin dev-next
  

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Linux AMD64
        run: |
          go build -tags "with_reality with_utls with_quic" -o sing-box ./cmd/sing-box

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-linux-amd64
          path: sing-box
